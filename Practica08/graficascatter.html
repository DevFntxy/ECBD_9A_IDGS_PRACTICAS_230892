</style>
</head>

async function worker(queue){while(queue.length){const src=queue.pop();const im=await loadImage(src);for(const p of points)if(spriteSrc(p)===src)p.image=im;if((loaded+failed)%12===0)draw()}}
async function preloadAll(){const unique=[...new Set(points.map(spriteSrc).filter(Boolean))];totalUnique=unique.length;updateStatus();const q=unique.slice().reverse();await Promise.all(Array.from({length:Math.min(24,q.length)},()=>worker(q)));draw();updateStatus()}
function hitTest(mx,my){const arr=points.filter(p=>p.visible&&p.screen&&p.image);for(let i=arr.length-1;i>=0;i--){const p=arr[i],s=p.screen,size=Math.max(13,40*s.scale*p.sizeMul);if(mx>=s.x-size/2&&mx<=s.x+size/2&&my>=s.y-size/2&&my<=s.y+size/2)return p}return null}
function showTip(p,x,y){tip.innerHTML=`<b>${p.name}</b><br>${p.type1}${p.type2&&p.type2!=='Sin segundo tipo'?` / ${p.type2}`:''}<br><span class="muted">Generación ${p.generation} · ${p.origin}</span><br>${currentMetricLabel()}: <b>${currentMetricValue(p).toFixed(2)}</b><br>HP ${p.hp} · Atq ${p.attack} · Def ${p.defense}<br>AtE ${p.sp_atk} · DfE ${p.sp_def} · Vel ${p.speed}`;tip.style.display='block';tip.style.left=Math.min(W-220,x+14)+'px';tip.style.top=Math.max(8,y-20)+'px'}
canvas.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('mouseup',()=>dragging=false);window.addEventListener('mousemove',e=>{if(!dragging)return;rotY+=(e.clientX-lastX)*.008;rotX+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY;draw()});
canvas.addEventListener('mousemove',e=>{if(dragging){tip.style.display='none';return}const r=canvas.getBoundingClientRect(),p=hitTest(e.clientX-r.left,e.clientY-r.top);p?showTip(p,e.clientX-r.left,e.clientY-r.top):tip.style.display='none'});canvas.addEventListener('mouseleave',()=>tip.style.display='none');
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.09:.92;zoom=Math.max(.45,Math.min(2.6,zoom));draw()},{passive:false});
[filterOrigin,filterType,filterGen,filterLegendary,filterArtificialName,zMetric,sizeSel].forEach(el=>el.addEventListener('change',applyControls));
document.getElementById('reset').onclick=()=>{rotX=-.62;rotY=.90;zoom=1;filterOrigin.value=filterType.value=filterGen.value=filterLegendary.value=filterArtificialName.value='all';zMetric.value='avg';sizeSel.value='1';applyControls()};
window.addEventListener('resize',resize);buildMenus();resize();applyControls();preloadAll();
</script>
</body></html>
